name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Test authorization flow
        run: npm test

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build static frontend
        run: npm run build

      - name: Verify deploy entrypoint
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/dashboard.js
          test -s dist/khe2-radar.apk
          test -s vercel.json

      - name: Reject generated files committed to Git
        shell: bash
        run: |
          if git ls-files | grep -Ev '^khe2-radar\.apk$' | grep -Eq '(^|/)node_modules/|(^|/)\.gradle/|\.apk$|\.aab$'; then
            echo "Generated files must not be committed."
            exit 1
          fi

